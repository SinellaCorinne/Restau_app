name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # permet de lancer manuellement depuis l'onglet Actions

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installe Java (requis par le build Android)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Installe Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      # 4. Télécharge les dépendances Flutter
      - name: Install dependencies
        run: flutter pub get

      # 5. Compile l'APK en mode release
      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 6. Publie l'APK comme artefact téléchargeable
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: restau-app-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
