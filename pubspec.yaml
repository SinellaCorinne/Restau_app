version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation & state
  provider: ^6.0.5
  get: ^4.6.5

  # UI
  cupertino_icons: ^1.0.6
  iconsax: any
  google_fonts: ^6.2.1

  # Réseau & fichiers
  http: ^1.0.0
